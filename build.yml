name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - run: go test -v ./...
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Fawusk-alpha-0.8-windows-x64
          path: |
            dist/Fawusk-alpha-0.8.exe
            dist/SHA256SUMS.txt
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md
            docs/
            RELEASE_RU.md
